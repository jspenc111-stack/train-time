name: Publish "Leave By has moved" page
# One-time: replaces the old app on GitHub Pages with a page pointing to the new address,
# plus a clean-up service worker that removes only Leave By's old files from the phone.
on:
  push:
    branches: [main]
    paths:
      - 'moved/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: moved
      - id: deployment
        uses: actions/deploy-pages@v4
